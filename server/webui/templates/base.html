<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor</title>
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="app-root">
  <header class="topbar">
    <div class="brand">● Monitor</div>
    <div class="search"><input id="searchInput" type="search" placeholder="ค้นหา host…" aria-label="ค้นหา host"></div>
    <nav class="topnav" aria-label="เมนูหลัก">
      <a href="#view-fleet" data-nav="fleet">Fleet</a>
      <a href="#view-alerts" data-nav="alerts">Alerts</a>
      <a href="#view-settings" data-nav="settings">ตั้งค่า</a>
    </nav>
    <div class="user">
      <span id="currentUser"></span>
      <button id="logoutBtn">ออกจากระบบ</button>
    </div>
  </header>

  <main class="content" id="content">
    <div class="banner error" id="errorBanner" style="display:none"></div>
    {% include "parts/fleet.html" %}
    {% include "parts/host.html" %}
    {% include "parts/alerts.html" %}
    {% include "parts/settings.html" %}
  </main>

  <footer class="statusbar" id="statusbar">Monitor v{{ version }}</footer>
</div>

<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true">
  <div class="modal">
    <p id="modalText"></p>
    <div class="actions">
      <button class="btn" id="modalCancel">ยกเลิก</button>
      <button class="btn danger" id="modalConfirm">ยืนยัน</button>
    </div>
  </div>
</div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="/static/js/chart.umd.min.js"></script>
<script src="/static/js/format.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/scale.js"></script>
<script src="/static/js/app.js"></script>
<script src="/static/js/dashboard.js"></script>
<script src="/static/js/alerts.js"></script>
</body>
</html>
