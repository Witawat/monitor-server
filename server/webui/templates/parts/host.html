<section class="view" id="view-host" data-view="host">
    <div class="toolbar">
      <h2>Host</h2>
      <select id="hostSelect" aria-label="เลือก host"></select>
      <span class="badge online" id="hostBadge"></span>
      <span style="flex:1"></span>
      <button class="btn" id="editHostBtn" title="แก้ไขค่า host">แก้ไข</button>
      <input id="tagInput" placeholder="tags (คั่น ,)" aria-label="tags">
      <button class="btn" id="saveTagsBtn">ตั้ง tags</button>
      <a class="btn" id="exportBtn" href="#" download>export CSV</a>
      <button class="pill active" data-range="1h">1h</button>
    <button class="pill" data-range="6h">6h</button>
    <button class="pill" data-range="1d">1d</button>
    <button class="pill" data-range="7d">7d</button>
    <button class="pill" data-range="30d">30d</button>
    <button class="pill" data-range="45d">45d</button>
  </div>
  <div id="hostIdLabel" style="display:none"></div>
  <div class="host-alerts" id="hostAlerts"></div>
  <div class="kpi-row" id="kpiRow"></div>
  <div id="hostInfoRow" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"></div>
  <div id="servicesRow" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px"></div>
  <div class="ports-section" id="portsSection">
    <div class="subhead">Ports ที่เปิด/ปิด</div>
    <table class="ports-table">
      <thead><tr><th>Port</th><th>ชื่อ</th><th>สถานะ</th></tr></thead>
      <tbody id="portsBody"></tbody>
    </table>
  </div>
  <div class="ports-section" id="topProcSection">
    <div class="subhead">Process ที่ใช้ทรัพยากรสูง</div>
    <table class="ports-table">
      <thead><tr><th>PID</th><th>Process</th><th>CPU</th><th>Mem</th></tr></thead>
      <tbody id="topProcBody"></tbody>
    </table>
  </div>
  <div class="ports-section" id="nicSection">
    <div class="subhead">Network Interfaces</div>
    <table class="ports-table">
      <thead><tr><th>Interface</th><th>สถานะ</th><th>IP</th><th>MAC</th></tr></thead>
      <tbody id="nicBody"></tbody>
    </table>
  </div>
  <div class="toolbar">
    <span class="chart-label">Metric:</span>
    <div class="chips" id="metricChips" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  </div>
  <div class="chart-card">
    <div class="chart-wrap"><canvas id="metricChart"></canvas></div>
  </div>
</section>
