<section class="view" id="view-fleet" data-view="fleet">
  <div class="toolbar">
    <h2>Fleet</h2>
    <button class="pill active" data-filter="all" id="filterAll">ทั้งหมด</button>
    <button class="pill" data-filter="online" id="filterOnline">🟢 ออนไลน์</button>
    <button class="pill" data-filter="offline" id="filterOffline">○ ออฟไลน์</button>
    <span style="flex:1"></span>
    <span id="tagFilters" style="display:flex;gap:6px;flex-wrap:wrap"></span>
  </div>
  <div class="fleet-stats" id="fleetStats" aria-live="polite"></div>
  <div class="grid" id="hostGrid"></div>
</section>
