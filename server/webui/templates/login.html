<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เข้าสู่ระบบ — Monitor</title>
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="loginForm">
    <h1>● Monitor</h1>
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn primary" type="submit" id="loginBtn" style="width:100%">เข้าสู่ระบบ</button>
    <p class="login-error" id="loginError"></p>
    <p class="login-credit">Monitor v{{ version }} · พัฒนาโดย MAKET WITAWAT · <a href="https://github.com/Witawat/monitor-server" target="_blank" rel="noopener">github.com/Witawat/monitor-server</a></p>
  </form>
</div>
<script src="/static/js/login.js"></script>
</body>
</html>
