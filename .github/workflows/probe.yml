name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # รัน build-manylinux.sh ฉบับเต็ม (คำสั่งเดียวกับ job build-linux ใน release.yml)
      - name: Full build in manylinux_2_28 container
        shell: bash
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            quay.io/pypa/manylinux_2_28_x86_64:2026.01.04-1 \
            bash scripts/build-manylinux.sh

      - name: Verify artifacts
        shell: bash
        run: |
          ls -l dist/monitor-server dist/monitor-agent
          echo "--- max GLIBC_ symbol (server) ---"
          objdump -T dist/monitor-server | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -uV | tail -3
          echo "--- max GLIBC_ symbol (agent) ---"
          objdump -T dist/monitor-agent | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sort -uV | tail -3
