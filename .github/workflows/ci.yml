name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio

      - name: Ruff (lint)
        run: ruff check server agent shared tests

      - name: Mypy (type)
        # disable unused-ignore: จำเป็นเพราะโค้ด cross-platform (ctypes.windll ไม่มีบน linux stub,
        # os.statvfs ไม่มีบน windows stub) — ฟ้องคนละที่ตาม platform ที่รัน mypy
        run: mypy --disable-error-code=unused-ignore server agent shared

      - name: Pytest
        run: pytest -q
