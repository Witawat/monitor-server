name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv + install deps
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt -r requirements-build.txt pytest pytest-asyncio

      - name: Run tests (sanity)
        run: .venv\Scripts\python -m pytest -q

      - name: Build exe
        shell: cmd
        run: scripts\build.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-windows
          path: dist/
          if-no-files-found: error

  build-linux:
    name: Build (Linux — glibc 2.35)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv + install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-build.txt pytest pytest-asyncio

      - name: Run tests (sanity)
        run: .venv/bin/python -m pytest -q

      - name: Make icon
        run: .venv/bin/python scripts/make_icon.py

      - name: Build monitor-server
        run: |
          .venv/bin/python -m PyInstaller --noconfirm --clean --onefile \
            --name monitor-server \
            --add-data "server/webui:server/webui" \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            run.py

      - name: Build monitor-agent
        run: .venv/bin/python -m PyInstaller --noconfirm --clean --onefile --name monitor-agent agent/agent.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ls -l dist/
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "Automated release of monitor-server + monitor-agent (Windows .exe + Linux ELF, Ubuntu 24.04/glibc 2.35+ = Debian 12, Ubuntu 22.04+, Fedora 38+, ..."
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            dist/monitor-server.exe dist/monitor-agent.exe \
            dist/monitor-server dist/monitor-agent --clobber
