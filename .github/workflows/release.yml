name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-release:
    name: Build exe + publish release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv + install build deps
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests (sanity)
        run: |
          .venv\Scripts\python -m pytest -q

      - name: Build exe (icon + UPX + PyInstaller)
        run: scripts\build.bat
        shell: cmd

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" `
            --title "${{ github.ref_name }}" `
            --notes "Automated release of monitor-server + monitor-agent."
          gh release upload "${{ github.ref_name }}" `
            --repo "${{ github.repository }}" `
            dist\monitor-server.exe dist\monitor-agent.exe --clobber
        shell: pwsh
