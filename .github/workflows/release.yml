name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv + install deps
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt -r requirements-build.txt pytest pytest-asyncio

      - name: Run tests (sanity)
        run: .venv\Scripts\python -m pytest -q

      - name: Build exe
        shell: cmd
        run: scripts\build.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-windows
          path: dist/
          if-no-files-found: error

  build-linux:
    name: Build (Linux — manylinux/glibc 2.17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in manylinux_2_17 container (glibc 2.17)
        shell: bash
        # checkout/upload รันบน host (Node 24); build รันใน container manylinux_2_17
        # (glibc 2.17) → binary ครอบคลุม distro เก่า (CentOS 7 ขึ้นไป)
        # ใช manylinux_2_17 แทน 2014 — image เก่า rebuild python โดยไมมี shared lib → PyInstaller ล้ม
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            quay.io/pypa/manylinux_2_17_x86_64:latest \
            bash scripts/build-manylinux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ls -l dist/
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "Automated release of monitor-server + monitor-agent (Windows .exe + Linux ELF, ครอบคลุม glibc 2.17+ = CentOS 7 ขึ้นไป)."
          gh release upload "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            dist/monitor-server.exe dist/monitor-agent.exe \
            dist/monitor-server dist/monitor-agent --clobber
