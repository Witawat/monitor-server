name: Release

on:
  push:
    tags: ["v*"]
  # เผื่อ tag push ไม่ได้ trigger (เรียกมือจาก Actions tab — กรอก tag ที่ publish เช่น v0.3.3)
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag ที่จะ publish (เช่น v0.3.3) — ต้อง push tag ไว้ก่อน"
        required: true
        type: string

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create venv + install deps
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt -r requirements-build.txt pytest pytest-asyncio

      - name: Run tests (sanity)
        run: .venv\Scripts\python -m pytest -q

      - name: Build exe
        shell: cmd
        run: scripts\build.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-windows
          path: dist/
          if-no-files-found: error

  build-linux:
    name: Build (Linux — manylinux_2_28, glibc 2.28)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in manylinux_2_28 container
        shell: bash
        # manylinux_2_28 = glibc 2.28 (RHEL 8 base) → binary รันได้บน
        # Alma/Rocky 8-9, RHEL 8-9, Ubuntu 20.04+, Debian 11+, Fedora 32+
        # docker run บน host (checkout/upload อยู่บน Node) — container job เคยมีปัญหา
        # pin image tag (2026.01.04-1) เพื่อให้ build reproducible
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            quay.io/pypa/manylinux_2_28_x86_64:2026.01.04-1 \
            bash scripts/build-manylinux.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # tag push → ref_name = tag · dispatch มือ → ใช้ input.tag
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          case "$TAG" in
            v*) ;;
            *) echo "ref '$TAG' ไม่ใช่ version tag (v*) — abort"; exit 1 ;;
          esac
          ls -l dist/
          # แทนที่ ${TAG} ในเทมเพลต notes
          sed "s/\${TAG}/$TAG/g" .github/release-notes.md > notes.txt
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes-file notes.txt
          gh release upload "$TAG" \
            --repo "${{ github.repository }}" \
            dist/monitor-server.exe dist/monitor-agent.exe \
            dist/monitor-server dist/monitor-agent --clobber
