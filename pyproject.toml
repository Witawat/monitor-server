[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monitor-server"
version = "0.3.3"
description = "ระบบ monitor server ข้ามแพลตฟอร์ม (agent push → server → WebUI)"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["server", "shared", "agent"]

[tool.ruff]
line-length = 99
target-version = "py311"
exclude = [".venv", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = [".venv", "data", "logs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
